<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#2b2b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Liberta"></head><body>
<title>Liberta Finanças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna — cabeçalho fixo com ano + trilho de meses; corpo alterna entre "mês" (checklist) e "ano" (panorama + insights) */
:root{
  --bg:#F4F2EF; --surface:#FFFFFF; --surface-2:#ECE9E4; --fg:#1C1B19; --muted:#6E6A64; --line:#E0DCD5;
  --accent:#2A2926; --accent-fg:#F7F5F1; --accent-soft:#E7E3DC; --bar:#2A2926;
  --pos:#56704F; --pos-soft:#E3E9DF; --expense:#A4513B; --expense-soft:#F2E1DA; --warn:#94743A; --warn-soft:#F1E8D6; --danger:#A4513B;
  --inc:#2A2926; --exp:#BDB6AB; --hero:#2A2926; --hero-fg:#F4F2EF; --hero-pos:#B9D1AE; --hero-neg:#F0A58E;
  --c1:#B36A4E; --c2:#B38B36; --c3:#6E907A; --c4:#587A93; --c5:#8A6789; --c6:#6E7D3F;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 4px 16px rgba(28,27,25,.04);
  --f-display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
/* tema: automático segue o sistema; data-mode (escolha no app) vence */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode]){
  --bg:#151413; --surface:#1D1C1A; --surface-2:#272522; --fg:#EDEAE4; --muted:#9C978F; --line:#302E2A;
  --accent:#EDEAE4; --accent-fg:#151413; --accent-soft:#302E2A; --bar:#D9D4CB;
  --pos:#A3BE99; --pos-soft:#252E22; --expense:#E28D74; --expense-soft:#3A2520; --warn:#D6B36E; --warn-soft:#352C1B; --danger:#E28D74;
  --inc:#EDEAE4; --exp:#6D6861; --hero:#EDEAE4; --hero-fg:#151413; --hero-pos:#3F5A38; --hero-neg:#9A4630;
  --c1:#D98E70; --c2:#D9B566; --c3:#9DBBA5; --c4:#8AA7BD; --c5:#B293B4; --c6:#A9B872;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-mode]){
  --bg:#151413; --surface:#1D1C1A; --surface-2:#272522; --fg:#EDEAE4; --muted:#9C978F; --line:#302E2A;
  --accent:#EDEAE4; --accent-fg:#151413; --accent-soft:#302E2A; --bar:#D9D4CB;
  --pos:#A3BE99; --pos-soft:#252E22; --expense:#E28D74; --expense-soft:#3A2520; --warn:#D6B36E; --warn-soft:#352C1B; --danger:#E28D74;
  --inc:#EDEAE4; --exp:#6D6861; --hero:#EDEAE4; --hero-fg:#151413; --hero-pos:#3F5A38; --hero-neg:#9A4630;
  --c1:#D98E70; --c2:#D9B566; --c3:#9DBBA5; --c4:#8AA7BD; --c5:#B293B4; --c6:#A9B872;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
:root[data-mode="dark"]{
  --bg:#151413; --surface:#1D1C1A; --surface-2:#272522; --fg:#EDEAE4; --muted:#9C978F; --line:#302E2A;
  --accent:#EDEAE4; --accent-fg:#151413; --accent-soft:#302E2A; --bar:#D9D4CB;
  --pos:#A3BE99; --pos-soft:#252E22; --expense:#E28D74; --expense-soft:#3A2520; --warn:#D6B36E; --warn-soft:#352C1B; --danger:#E28D74;
  --inc:#EDEAE4; --exp:#6D6861; --hero:#EDEAE4; --hero-fg:#151413; --hero-pos:#3F5A38; --hero-neg:#9A4630;
  --c1:#D98E70; --c2:#D9B566; --c3:#9DBBA5; --c4:#8AA7BD; --c5:#B293B4; --c6:#A9B872;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:13px}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
.sync.busy::before{background:var(--warn)}
.sync.off::before{background:var(--danger)}
.yearsel{display:flex;align-items:center;gap:6px}
select.year{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 28px 6px 12px;font-weight:700;font-family:var(--f-display);font-size:16px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn{white-space:nowrap}
.iconbtn.mode{padding:0 9px}
@media (max-width:520px){.iconbtn .lbl{display:none}}
@media (max-width:440px){.sync{font-size:0;gap:0}.top-row{gap:8px}.brand{font-size:20px}select.year{font-size:15px;padding-right:24px}}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 7px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px}
.chip .bar{width:100%;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.chip .bar b{display:block;height:100%;background:var(--bar)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on .bar{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.chip.on .bar b{background:var(--bg)}
.chip.now:not(.on){border-color:var(--accent)}
.chip.yr{padding-inline:14px;justify-content:center}

main{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5.6vw,40px);font-weight:700;line-height:1.05;letter-spacing:-.04em}
h1 span{color:var(--muted);font-weight:500}
h2{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.finbtn{border:0;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.finbtn:hover{filter:brightness(1.08)}
.finbtn.armed{background:var(--warn);color:#fff;white-space:normal;text-align:left}
.finbtn.ghost{background:var(--surface-2);color:var(--fg)}
.donechip{font-size:13px;font-weight:700;color:var(--pos);background:var(--pos-soft);padding:6px 12px;border-radius:999px}
.ring{display:flex;align-items:center;gap:12px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .t{font-size:13px;color:var(--muted);line-height:1.3}
.ring .t b{display:block;font-family:var(--f-display);font-size:20px;color:var(--fg)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,3.4vw,24px);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.pos .v{color:var(--pos)} .kpi.neg .v{color:var(--danger)}
.kpi.dark{background:var(--hero);color:var(--hero-fg);border-color:var(--hero)}
.kpi.dark.pos .v{color:var(--hero-pos)} .kpi.dark.neg .v{color:var(--hero-neg)}
.kpi.dark .l,.kpi.dark .s{color:color-mix(in srgb,var(--hero-fg) 65%,transparent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h .spacer{min-width:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.grp{padding:6px 0}
.grp+.grp{border-top:1px solid var(--line)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.grp-h .num{letter-spacing:0;text-transform:none;font-size:13px}

.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:9px 12px 9px 16px;transition:background .15s}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;transition:all .15s}
.check svg{width:16px;height:16px;stroke:var(--accent-fg);stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:all .15s}
.row.paid .check{background:var(--accent);border-color:var(--accent)}
.row.paid .check svg{opacity:1;transform:none}
.row.late .check{border-color:var(--danger)}
.nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row.paid .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.parc{background:var(--accent-soft);color:var(--fg)}
.tag.ok{background:var(--pos-soft);color:var(--pos)}
.tag.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.vals{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.prev{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.prev small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.money{width:108px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 9px;font-weight:700;font-variant-numeric:tabular-nums}
.money::placeholder{color:var(--muted);font-weight:500}
.money:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.more{border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
.more:hover{background:var(--surface-2);color:var(--fg)}
@media (max-width:560px){
  .row{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  .vals{grid-column:2/4;grid-row:2;justify-content:space-between}
  .more{grid-column:3;grid-row:1}
  .prev{text-align:left}
}
.add{display:flex;align-items:center;gap:8px;margin:4px 16px 10px;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--muted);width:calc(100% - 32px)}
.add:hover{border-color:var(--accent);color:var(--accent)}
.cof{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cof-top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.dep{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.cof-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cof-bar b{display:block;height:100%;background:var(--bar);border-radius:4px;transition:width .3s}
.cof-sum{font-size:13px;color:var(--muted)}
.cof-sum b{color:var(--fg)}
.cof.done .nm{color:var(--muted)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{appearance:none;-webkit-appearance:none;margin:0;width:30px;height:30px;border-radius:50%;background:var(--sw);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches input:checked{box-shadow:0 0 0 2px var(--fg)}
.cof-adj{font-size:12.5px;font-weight:700;color:var(--expense)}
.cofmov{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.ins li.cofline{font-size:12.5px;color:var(--muted);margin-top:-5px}
.ins li.cofline em,.wd,.wdlist em{font-style:normal;color:var(--expense);font-weight:700}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.splitbar b{background:var(--bar)} .splitbar i{background:var(--expense)}
.splitleg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.wdlist{display:flex;flex-direction:column;gap:5px}
.wdlist div:not(.k){display:flex;justify-content:space-between;gap:8px;font-size:13px}
.orgbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.orgbtn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.orgbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.orgbar .chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:600}
.orgbar .chk input{width:17px;height:17px;accent-color:var(--accent)}
.row.orgrow{grid-template-columns:auto minmax(0,1fr) auto!important}
.grip{color:var(--muted);letter-spacing:-3px;font-weight:700;width:28px;text-align:center}
.mv{display:flex;gap:6px}
.mv button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;color:var(--fg)}
.mv button:disabled{opacity:.3;cursor:default}
.mv button:not(:disabled):active{background:var(--surface-2)}
.subbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}
.subh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--fg)}
.subh small{color:var(--muted);font-size:12px;font-weight:500}
.subrow{display:grid;grid-template-columns:auto minmax(0,1fr) 92px auto;gap:6px;align-items:center}
.subrow .sub-on{width:18px;height:18px;accent-color:var(--accent)}
.subrow .field{padding:7px 9px}
.subrow .sub-v{text-align:right}
.subrow .more{grid-column:auto!important;grid-row:auto!important}
.subrow:has(.sub-on:not(:checked)) .field{opacity:.55;text-decoration:line-through}
.subsum{font-size:12.5px;color:var(--muted)}
.subsum b{color:var(--fg)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bnav-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px}
.navs{display:flex;flex:1;gap:4px;max-width:420px}
.navs button{flex:1;border:0;background:transparent;border-radius:12px;padding:7px 4px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.navs button svg{width:20px;height:20px}
.navs button.on{color:var(--fg);background:var(--surface-2)}
.fab{margin-left:auto;border:0;background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:0 18px;height:50px;font-weight:700;font-size:15px;font-family:var(--f-display);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.dd-hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.dd-hero:has(> div:nth-child(5)){grid-template-columns:repeat(5,minmax(0,1fr))}
.dd-hero .s b{color:var(--hero-fg)}
@media (max-width:900px){.dd-hero:has(> div:nth-child(5)){grid-template-columns:1fr 1fr}.dd-hero:has(> div:nth-child(5)) > div:nth-child(n+3){border-top:1px solid color-mix(in srgb,var(--hero-fg) 15%,transparent);padding-top:12px}.dd-hero:has(> div:nth-child(5)) > div:nth-child(5){grid-column:1/-1}}
.dd-hero > div{min-width:0}
.dd-hero .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:color-mix(in srgb,var(--hero-fg) 62%,transparent)}
.dd-hero .v{font-family:var(--f-display);font-weight:700;font-size:clamp(21px,5.6vw,28px);margin-top:2px;letter-spacing:-.03em}
.dd-hero .v.g{color:var(--hero-pos)} .dd-hero .v.r{color:var(--hero-neg)}
.dd-hero .s{font-size:12.5px;color:color-mix(in srgb,var(--hero-fg) 62%,transparent)}
.dd-hero .s button{border:0;background:transparent;color:var(--hero-fg);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12.5px;font-weight:600;text-align:left;margin-top:4px}
.dd-ask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.dd-budget{padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px}
.dd-budget+.dd-budget{border-top:1px solid var(--line)}
.dd-btop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dd-bname{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}

const isDone=(y,m)=>isPast(y,m)||!!(S.months[mid(y,m)]&&S.months[mid(y,m)].finalized);
function cofVisible(k,ym){return String(k.createdYM||'0000-00')<=ym&&(k.status!=='done'||String(k.doneYM||'9999')>=ym)}
function cofTotal(k){return sum(Object.values(k.deposits||{}),v=>v)+sum(Object.values(k.adjust||{}),v=>v)}
function cofUpTo(k,ym){const f=o=>sum(Object.entries(o||{}).filter(([key])=>key<=ym),e=>e[1]);return f(k.deposits)+f(k.adjust)}
function cofDep(y,m){const ym=mid(y,m);return sum(Object.values(S.cofs),k=>((k.deposits||{})[ym]||0)+((k.adjust||{})[ym]||0))}
const COFC=['Argila','Mostarda','Sálvia','Ardósia','Ameixa','Oliva'];
function cofColor(k){let n=+k.color;if(!(n>=1&&n<=6)){const all=Object.values(S.cofs).sort((a,b)=>(a.order??9e15)-(b.order??9e15)||String(a.name).localeCompare(b.name));n=(Math.max(0,all.findIndex(x=>x.id===k.id))%6)+1}return `var(--c${n})`}
function cofList(ym){return Object.values(S.cofs).filter(k=>cofVisible(k,ym)).sort((a,b)=>(a.order??9e15)-(b.order??9e15)||String(a.name).localeCompare(b.name))}
function futureMatches(name){const out=[];const base=S.year*12+S.month;
  Object.keys(S.months).sort().forEach(key=>{const [yy,mm]=key.split('-').map(Number);const k=yy*12+mm-base;if(k<=0)return;
    const want=advanceName(name,k);const d=S.months[key];
    for(const g of ['fixed','variable','income','invest'])(d[g]||[]).forEach(i=>{if(i.name===name||(want&&i.name===want))out.push({key,g,id:i.id})})});
  return out}
function applyOrderForward(){const y=S.year,m0=S.month;const cur=getM(y,m0);if(!cur)return 0;let n=0;const key=x=>baseName(x.name).toLowerCase();
  for(const id of Object.keys(S.months).sort()){const [yy,mm]=id.split('-').map(Number);if((yy*12+mm)-(y*12+m0)<=0)continue;
    const d=norm(clone(S.months[id]),yy,mm);let changed=false;
    for(const g of ['fixed','variable']){const order=cur[g].map(key),first=order.map(k=>k.split(/[\s\/;\-]+/)[0]);
      const sorted=d[g].map((x,i)=>{let r=order.indexOf(key(x));if(r<0)r=first.indexOf(key(x).split(/[\s\/;\-]+/)[0]);return {x,i,r:r<0?1e9:r}}).sort((a,b)=>a.r-b.r||a.i-b.i).map(o=>o.x);
      if(sorted.some((x,i)=>x!==d[g][i])){d[g]=sorted;changed=true}}
    if(changed){S.months[id]=d;commit(yy,mm);n++}}
  return n}
function subRow(it){return `<div class="subrow"><input type="checkbox" class="sub-on"${it.on!==false?' checked':''} title="Entra no total" aria-label="Entra no total"><input class="field sub-n" value="${esc(it.name||'')}" placeholder="Ex.: Spotify" aria-label="Nome do item"><input class="field sub-v" inputmode="decimal" value="${dec(it.value??null)}" placeholder="0,00" aria-label="Valor do item"><button type="button" class="more" data-sub="del" aria-label="Remover item">×</button></div>`}
function subBlock(x){const its=x.items||[];return `<div class="subbox"><div class="subh"><b>Itens desta conta</b><small>opcional · ex.: cada streaming</small></div>
  <div id="subs">${its.map(subRow).join('')}</div><div class="subsum" id="subsum">${its.length?'':'Divida a conta em partes. A soma dos itens marcados vira o valor previsto.'}</div>
  <button type="button" class="add" data-sub="add" style="margin:0;width:100%">+ Adicionar item</button></div>`}
function readSubs(){return [...document.querySelectorAll('#subs .subrow')].map(r=>({id:uid(),name:r.querySelector('.sub-n').value.trim(),value:parseMoney(r.querySelector('.sub-v').value),on:r.querySelector('.sub-on').checked})).filter(it=>it.name||it.value!=null)}
function subRecalc(setPrev){const its=readSubs();const el=document.getElementById('subsum');if(!el)return;
  if(!its.length){el.textContent='Divida a conta em partes. A soma dos itens marcados vira o valor previsto.';return}
  const on=its.filter(i=>i.on),off=its.filter(i=>!i.on),tot=sum(on,i=>i.value);
  el.innerHTML=`Soma dos marcados: <b class="num">${brl(tot)}</b>${off.length?` · fora do total: ${off.map(i=>esc(i.name||'item')).join(', ')} (${brl(sum(off,i=>i.value))})`:''}`;
  if(setPrev){const pv=document.getElementById('f_prev');if(pv)pv.value=dec(tot)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sub]');if(!b)return;
  if(b.dataset.sub==='add'){const box=document.getElementById('subs');box.insertAdjacentHTML('beforeend',subRow({on:true}));box.lastElementChild.querySelector('.sub-n').focus();subRecalc(false)}
  else{b.closest('.subrow').remove();subRecalc(true)}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#subs'))subRecalc(true)});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('sub-on'))subRecalc(true)});
function firstOpen(y){for(let m=(y===NY?NM:1);m<=12;m++){if(!isDone(y,m))return m}return y===NY?NM:12}
function parcel(name){const m=String(name).match(PARC);return m?{n:+m[1],t:+m[2]}:null}
function advanceName(name,k){const p=parcel(name);if(!p)return name;const n=p.n+k;if(n>p.t)return null;return name.replace(PARC,n+'/'+p.t)}
function baseName(name){return String(name).replace(PARC,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim()}
function addMonths(y,m,k){const t=(y*12+(m-1))+k;return [Math.floor(t/12),t%12+1]}
function blankMonth(y,m){return {year:y,month:m,income:[{id:uid(),name:'Salário',prev:null,real:null},{id:uid(),name:'Renda extra',prev:null,real:null},{id:uid(),name:'Dinheiro inesperado',prev:null,real:null}],invest:[{id:uid(),name:'Renda fixa',prev:null,real:null},{id:uid(),name:'Renda variável',prev:null,real:null},{id:uid(),name:'Demais investimentos',prev:null,real:null}],fixed:[],variable:[],unplanned:[],notes:''}}
function norm(d,y,m){d=d||blankMonth(y,m);for(const k of ['income','invest','fixed','variable','unplanned','budgets','tx'])d[k]=Array.isArray(d[k])?d[k]:[];d.notes=d.notes||'';d.year=y;d.month=m;return d}
function copyFrom(src,y,m,k){
  const it=x=>{const o={id:uid(),name:x.name,prev:x.prev??null,real:null};if(x.due)o.due=x.due;return o};
  const bill=x=>{const n=advanceName(x.name,k);if(n==null)return null;const o={id:uid(),name:n,prev:x.prev??null,real:null,paid:false,due:x.due??null};if(x.items&&x.items.length)o.items=clone(x.items);return o};
  return {year:y,month:m,income:src.income.map(it),invest:src.invest.map(it),fixed:src.fixed.map(bill).filter(Boolean),variable:src.variable.map(bill).filter(Boolean),unplanned:[],budgets:clone(src.budgets||[]),tx:[],notes:''};
}
function getM(y,m){return S.months[mid(y,m)]?norm(S.months[mid(y,m)],y,m):null}
function years(){const s=new Set(Object.values(S.months).map(d=>d.year));return [...s].sort((a,b)=>a-b)}

function calc(d,y,m){
  const bills=[...d.fixed,...d.variable];
  const unpl=sum(d.unplanned,x=>x.value);
  const B=d.budgets||[], TX=d.tx||[];
  const budTotal=sum(B,b=>b.total), budSpent=sum(TX.filter(t=>String(t.src).startsWith('b:')),t=>t.v);
  const budProj=sum(B,b=>Math.max(b.total||0,sum(TX.filter(t=>t.src==='b:'+b.id),t=>t.v)));
  const avu=sum(TX.filter(t=>t.src==='avu'),t=>t.v);
  const incPrev=sum(d.income,x=>x.prev), incReal=sum(d.income,x=>x.real);
  const expPrev=sum(bills,x=>x.prev)+budTotal;
  const paidSum=sum(bills.filter(b=>b.paid),x=>x.real??x.prev);
  const pend=bills.filter(b=>!b.paid);
  const toPay=sum(pend,x=>x.prev);
  const invPrev=0, invReal=cofDep(y,m);
  const filled=d.income.some(x=>x.real>0)||bills.some(b=>b.paid)||TX.length>0;
  const closed=(isPast(y,m)||!!d.finalized)&&filled;
  const inc=closed?incReal:sum(d.income,x=>x.real??x.prev);
  const exp=closed?sum(bills,x=>x.real)+unpl+avu+budSpent:sum(bills,x=>x.paid?(x.real??x.prev):x.prev)+unpl+avu+budProj;
  const late=isNow(y,m)?pend.filter(b=>b.due&&b.due<ND):(isPast(y,m)&&filled?pend:[]);
  return {budTotal,budSpent,budProj,avu,bills,unpl,incPrev,incReal,expPrev,paidSum,pend,toPay,invPrev,invReal,filled,closed,inc,exp,bal:inc-exp,paidN:bills.length-pend.length,total:bills.length,late};
}

/* ---------- persistence ---------- */
function setSync(){const el=document.getElementById('sync');if(!el)return;el.className='sync'+(S.offline?' off':S.saving?' busy':'');el.textContent=S.offline?'Sem conexão':S.saving?'Salvando…':'Salvo'}
function commit(y,m){
  const id=mid(y,m), body=clone(S.months[id]);
  S.saving++;setSync();
  chains[id]=(chains[id]||Promise.resolve()).then(()=>db.doc('months/'+id).set(body)).then(()=>{S.offline=false}).catch(e=>{
    if(e&&e.code==='unavailable'){return new Promise(r=>setTimeout(r,800+Math.random()*700)).then(()=>db.doc('months/'+id).set(body))}
    throw e;
  }).catch(e=>{S.offline=true;toast(e&&e.code==='invalid_argument'?'Você não tem permissão para editar estes dados.':'Não consegui salvar. Confira a conexão e tente de novo.')}).finally(()=>{S.saving--;setSync()});
  return chains[id];
}
function commitCof(id){const body=clone(S.cofs[id]);delete body.id;S.saving++;setSync();const key='cof:'+id;
  chains[key]=(chains[key]||Promise.resolve()).then(()=>db.doc('cofrinhos/'+id).set(body)).then(()=>{S.offline=false}).catch(()=>{S.offline=true;toast('Não consegui salvar o cofrinho. Confira a conexão.')}).finally(()=>{S.saving--;setSync()});}
function mutate(fn,y=S.year,m=S.month){const id=mid(y,m);const d=norm(S.months[id]?clone(S.months[id]):null,y,m);fn(d);S.months[id]=d;commit(y,m);render()}

let toastT;function toast(t){clearTimeout(toastT);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;toastT=setTimeout(()=>el.remove(),3200)}

/* ---------- render ---------- */
const app=document.getElementById('app'), modal=document.getElementById('modal');
function typing(){const a=document.activeElement;return a&&(app.contains(a)||modal.contains(a))&&a.matches('input:not([type=checkbox]):not([type=radio]),textarea')}
function softRender(){if(typing()){S.dirty=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!typing()){S.dirty=false;render()}},0));

function render(){
  const key=document.activeElement?.dataset?.key;
  if(S.nodb){app.innerHTML=`<div class="state wrap"><h2>Não foi possível abrir seus dados</h2><p>Recarregue a página. Se continuar, confira a internet.</p></div>`;return}
  if(!S.loaded)return;
  const ys=years();
  if(!ys.length){app.innerHTML=header([])+`<main class="wrap"><div class="state"><h2>Nenhum ano criado ainda</h2><p>Crie o primeiro ano para começar a registrar suas contas.</p><p><button class="btn" data-action="newyear">Criar ano ${NY}</button></p></div></main>`;renderModal();return}
  if(!ys.includes(S.year))S.year=ys.includes(NY)?NY:ys[ys.length-1];
  app.innerHTML=header(ys)+`<main class="wrap">${S.view==='year'?yearView():S.view==='day'?dayView():monthView()}${L.hash?'<div class="appfoot"><button class="linkbtn" data-action="changepin">Trocar senha</button></div>':''}</main>${bottomNav()}`;
  setSync();renderModal();
  if(key){const el=document.querySelector(`[data-key="${CSS.escape(key)}"]`);if(el)el.focus({preventScroll:true})}
  const on=app.querySelector('.chip.on');if(on&&!S._scrolled){on.scrollIntoView({inline:'center',block:'nearest'});S._scrolled=true}
}

function header(ys){
  const y=S.year;
  const chip=i=>{const n=MESC[i];const onv=S.view!=='year';const d=getM(y,i+1);const c=d?calc(d,y,i+1):null;const pct=c&&c.total?Math.round(c.paidN/c.total*100):0;
    return `<button class="chip${onv&&S.month===i+1?' on':''}${isNow(y,i+1)?' now':''}" data-action="month" data-m="${i+1}" aria-label="${MES[i]}: ${pct}% das contas pagas">${n}<span class="bar"><b style="width:${pct}%"></b></span></button>`};
  const idx=[...Array(12).keys()];
  const past=idx.filter(i=>isDone(y,i+1)), open=idx.filter(i=>!isDone(y,i+1));
  let chips='';
  if(!open.length||!past.length){chips=idx.map(chip).join('')}
  else{
    const sel=S.view==='month'?S.month-1:-1;
    chips=open.map(chip).join('');
    if(S.showPast)chips+=`<button class="chip yr" data-action="togglepast" aria-expanded="true">Ocultar anteriores</button>`+past.slice().reverse().map(chip).join('');
    else chips+=(past.includes(sel)?chip(sel):'')+`<button class="chip yr" data-action="togglepast" aria-expanded="false">Finalizados (${past.length})</button>`;
  }
  return `<header class="top"><div class="wrap">
    <div class="top-row"><div class="brand"><i>L</i><span class="bt">Liberta</span></div><div class="spacer"></div><span id="sync" class="sync">Salvo</span>
      <div class="yearsel">${ys.length?`<select class="year" id="yearsel" aria-label="Ano">${ys.map(v=>`<option${v===y?' selected':''}>${v}</option>`).join('')}</select>`:''}
      ${L.hash?`<button class="iconbtn mode" data-action="lockapp" title="Bloquear agora" aria-label="Bloquear agora"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>`:''}
      <button class="iconbtn mode" data-action="mode" title="Tema: ${MODES[S.mode].l}" aria-label="Tema: ${MODES[S.mode].l}. Tocar para trocar">${MODES[S.mode].i}<span class="lbl">${MODES[S.mode].l}</span></button>
      ${ys.length&&S.dl!==false?`<button class="iconbtn" data-action="export" title="Baixar ${y} em Excel">⤓<span class="lbl"> Excel</span></button>`:''}
      ${S.loaded&&!S.nodb?`<button class="iconbtn" data-action="backup" title="Backup dos seus dados">⇅<span class="lbl"> Backup</span></button>`:''}
      <button class="iconbtn" data-action="newyear" title="Criar novo ano">+ Ano</button></div></div>
    ${ys.length?`<nav class="rail" aria-label="Meses">${chips}</nav>`:''}
  </div></header>`;
}

function ringSvg(p){const r=26,c=2*Math.PI*r;return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--bar)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg>`}

function monthView(){
  const y=S.year,m=S.month;const d=getM(y,m)||norm(null,y,m);const c=calc(d,y,m);
  const [py,pm]=addMonths(y,m,-1);const prev=getM(py,pm);
  let status;
  if(!c.total)status='Nenhuma conta cadastrada neste mês.';
  else if(!c.pend.length)status='Todas as contas deste mês estão pagas.';
  else status=`Faltam ${c.pend.length} ${c.pend.length===1?'conta':'contas'} · ${brl(c.toPay)} a pagar${c.late.length?` · <b style="color:var(--danger)">${c.late.length} em atraso</b>`:''}`;
  const banner=(!d.fixed.length&&!d.variable.length&&prev&&(prev.fixed.length||prev.variable.length))?`<div class="banner"><span>Este mês ainda está vazio. Quer trazer as contas de <b>${MES[pm-1]}</b>? As parcelas avançam sozinhas.</span><span class="spacer"></span><button class="btn" data-action="copyprev">Trazer contas</button></div>`:'';
  const unfilled=isPast(y,m)&&!c.filled&&c.total?`<div class="banner"><span><b>${MES[m-1]} já passou</b> e nenhuma conta foi marcada como paga. Marque o que foi pago para o panorama do ano ficar certo.</span></div>`:'';
  return `
  <section class="hero"><div><div class="titlerow"><h1>${MES[m-1]} <span>${y}</span></h1>${
      d.finalized?`<span class="donechip">✓ Finalizado</span><button class="finbtn ghost" data-action="reopen">Reabrir</button>`
      :isPast(y,m)?'':`<button class="finbtn${S.finArm?' armed':''}" data-action="finalize">${S.finArm?`Faltam ${c.pend.length} ${c.pend.length===1?'conta':'contas'}. Finalizar mesmo assim?`:'Finalizar mês →'}</button>`}</div><p class="sub">${status}</p></div>
    <div class="ring">${ringSvg(c.total?c.paidN/c.total:0)}<div class="t"><b class="num">${c.paidN}/${c.total}</b>contas pagas</div></div></section>
  ${banner}${unfilled}
  <div class="kpis">
    <div class="kpi"><div class="l">Renda recebida</div><div class="v num">${brl(c.incReal)}</div><div class="s num">de ${brl(c.incPrev)} previstos</div></div>
    <div class="kpi"><div class="l">Já pago</div><div class="v num">${brl(c.paidSum+c.unpl+c.avu+c.budSpent)}</div><div class="s num">de ${brl(c.expPrev+c.unpl+c.avu)} no mês</div></div>
    <div class="kpi"><div class="l">Falta pagar</div><div class="v num">${brl(c.toPay)}</div><div class="s">${c.pend.length} ${c.pend.length===1?'conta pendente':'contas pendentes'}</div></div>
    <div class="kpi dark ${c.bal>=0?'pos':'neg'}"><div class="l">Saldo do mês</div><div class="v num">${brl(c.bal)}</div><div class="s">${c.closed?'fechado':'projetado se tudo for pago'}</div></div>
  </div>
  <section class="card">
    <div class="card-h"><h2>Contas do mês</h2><span class="spacer" style="flex:1"></span>
      ${S.org?'':`<div class="seg" role="tablist">${[['all','Todas'],['pending','Pendentes'],['paid','Pagas']].map(([k,l])=>`<button class="${S.filter===k?'on':''}" data-action="filter" data-f="${k}">${l}</button>`).join('')}</div>`}
      <button class="orgbtn${S.org?' on':''}" data-action="orgtoggle">${S.org?'✓ Concluir':'↕ Organizar'}</button></div>
    ${S.org?`<div class="orgbar"><span>Use as setas para mudar a ordem das contas.</span><label class="chk"><input type="checkbox" id="orgfut"${S.orgFuture?' checked':''}> Usar a mesma ordem nos próximos meses</label></div>`:''}
    ${group(d,'fixed',c)}${group(d,'variable',c)}
  </section>
  ${budgetStrip(d,y,m)}
  <div class="two">
    <section class="card"><div class="card-h"><h2>Renda</h2><span class="spacer" style="flex:1"></span><span class="num" style="font-weight:700">${brl(c.incReal)}</span></div>${group(d,'income',c,true)}</section>
    ${cofSection(y,m)}
  </div>
  ${d.unplanned.length?`<section class="card"><div class="card-h"><h2>Gastos não planejados</h2><span class="spacer" style="flex:1"></span><span class="num" style="font-weight:700;color:var(--expense)">${brl(c.unpl)}</span></div>
    ${d.unplanned.map(u=>`<div class="unp"><span class="d">${u.date?u.date.split('-').reverse().slice(0,2).join('/'):'—'}</span><span class="nm">${esc(u.desc)||'Sem descrição'}</span><span class="num" style="font-weight:700">${brl(u.value)}</span><button class="more" data-action="delunp" data-id="${u.id}" aria-label="Remover">×</button></div>`).join('')}
    <div class="empty" style="text-align:left">Os novos gastos avulsos agora ficam em <b>Dia a dia</b>.</div></section>`:''}
  <section class="card"><div class="card-h"><h2>Anotações de ${MES[m-1]}</h2></div><div style="padding:12px 16px 16px"><textarea class="field" id="notes" data-key="notes" placeholder="Lembretes, metas, combinados do mês…">${esc(d.notes)}</textarea></div></section>`;
}

function cofSection(y,m){
  const ym=mid(y,m), list=cofList(ym), all=Object.values(S.cofs);
  const rows=list.map(k=>{const tot=cofUpTo(k,ym), done=k.status==='done', pct=k.goal?Math.min(1,tot/k.goal):null;
    return `<div class="cof${done?' done':''}"><div class="cof-top"><div style="min-width:0"><div class="nm"><span class="cdot" style="background:${cofColor(k)}"></span>${esc(k.name)}</div>${(k.goal||done)?`<div class="meta">${k.goal?`<span class="tag">Meta ${brl(k.goal)}</span>`:''}${done?'<span class="tag ok">✓ Concluído</span>':(k.goal&&tot>=k.goal?'<span class="tag ok">Meta atingida</span>':'')}</div>`:''}</div>
      <label class="dep">neste mês<input class="money" inputmode="decimal" data-act="dep" data-id="${k.id}" data-key="dep:${k.id}" value="${dec((k.deposits||{})[ym]??null)}" placeholder="0,00" aria-label="Depósito em ${esc(k.name)} neste mês"></label>
      <button class="more" data-action="editcof" data-id="${k.id}" aria-label="Editar cofrinho ${esc(k.name)}">⋯</button></div>
      ${pct!=null?`<div class="cof-bar"><b style="width:${pct*100}%;background:${cofColor(k)}"></b></div>`:''}
      ${(k.adjust||{})[ym]?`<div class="cof-adj num">${k.adjust[ym]<0?'Retirado':'Ajuste'} neste mês: ${k.adjust[ym]<0?'−':'+'}${brl(Math.abs(k.adjust[ym]))}</div>`:''}<div class="cof-sum">Guardado: <b class="num">${brl(tot)}</b>${k.goal?` de ${brl(k.goal)} · ${Math.round(pct*100)}%${tot<k.goal?` · faltam ${brl(k.goal-tot)}`:''}`:''}</div></div>`}).join('');
  return `<section class="card"><div class="card-h"><h2>Cofrinhos</h2><span class="spacer" style="flex:1"></span><span class="num" style="font-weight:700">${brl(cofDep(y,m))}</span></div>
    ${rows||'<div class="empty">Nenhum cofrinho ativo neste mês.</div>'}

/* ---------- dia a dia ---------- */
const BCOL=['var(--c1)','var(--c2)','var(--c5)','var(--c4)','var(--c3)','var(--c6)'];
const AVU_TAGS=['Saúde','Beleza','Roupas','Pet','Outros'];
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const todayIdx=(y,m)=>isNow(y,m)?ND:(isPast(y,m)?daysIn(y,m):0);
function bSpent(d,b){return sum((d.tx||[]).filter(t=>t.src==='b:'+b.id),t=>t.v)}
function budColor(d,b){return BCOL[(d.budgets.indexOf(b)*3)%BCOL.length]}
function tagColor(d,src,tag){if(src==='avu'){const i=AVU_TAGS.indexOf(tag);return BCOL[(i<0?5:i+1)%BCOL.length]}
  if(String(src).startsWith('cof:')){const k=S.cofs[src.slice(4)];return k?cofColor(k):'var(--muted)'}
  const b=d.budgets.find(b=>'b:'+b.id===src);if(!b)return 'var(--muted)';const bi=d.budgets.indexOf(b),ti=Math.max(0,(b.tags||[]).indexOf(tag));return BCOL[(bi*3+ti)%BCOL.length]}
function txSrcLabel(d,t){if(t.src==='avu')return 'Avulso';if(String(t.src).startsWith('cof:')){const k=S.cofs[t.src.slice(4)];return 'Cofrinho '+(k?k.name:'')}const b=(d.budgets||[]).find(b=>'b:'+b.id===t.src);return b?b.name:'Avulso'}
function gTags(d,src){if(!src)return [];if(src==='avu')return AVU_TAGS;if(src.startsWith('cof:'))return [];const b=(d&&d.budgets||[]).find(b=>'b:'+b.id===src);return b?(b.tags||[]):[]}
function startBal(y,m,depth=0){const d=getM(y,m);if(d&&typeof d.startBalance==='number')return {v:d.startBalance,est:false,note:d.balNote||null};
  if(depth>2)return null;const [py,pm]=addMonths(y,m,-1);const pd=getM(py,pm);if(!pd)return null;const ps=startBal(py,pm,depth+1);if(!ps)return null;
  const pts=dailyBalance(pd,py,pm,ps.v);return {v:pts[pts.length-1].bal,est:true,note:null}}
/* movimentos do mês: o que você marcou (recebido/pago/lançado) até hoje; o resto é previsão */
function flowEvents(d,y,m){
  const N=daysIn(y,m),T=todayIdx(y,m),ym=mid(y,m),now=isNow(y,m),past=isPast(y,m),ev=[];
  const doneDay=x=>Math.max(1,Math.min(N,Math.min(x.due||1,Math.max(T,1))));
  const futDay=x=>now?Math.min(N,Math.max(x.due||T+1,T+1)):Math.min(N,x.due||1);
  d.income.forEach(x=>{if(x.real!=null){ev.push({day:past?Math.min(N,x.due||1):doneDay(x),amt:+x.real,kind:'inc',done:true,name:x.name})}
    else if(!past&&x.prev)ev.push({day:futDay(x),amt:+x.prev,kind:'inc',done:false,name:x.name})});
  [...d.fixed,...d.variable].forEach(b=>{if(b.paid)ev.push({day:past?Math.min(N,b.due||1):doneDay(b),amt:-(b.real??b.prev??0),kind:'bill',done:true,name:b.name});
    else if(!past&&b.prev)ev.push({day:futDay(b),amt:-b.prev,kind:'bill',done:false,name:b.name})});
  d.tx.filter(t=>!String(t.src).startsWith('cof:')).forEach(t=>ev.push({day:Math.min(N,Math.max(1,t.d)),amt:-t.v,kind:'tx',done:true,name:t.desc||t.tag}));
  d.unplanned.forEach(u=>ev.push({day:1,amt:-u.value,kind:'tx',done:true,name:u.desc}));
  const dep=sum(Object.values(S.cofs),k=>Math.max(0,(k.deposits||{})[ym]||0));
  if(dep)ev.push({day:past?1:Math.max(1,T),amt:-dep,kind:'cof',done:true,name:'Cofrinhos'});
  if(!past){const left=sum(d.budgets,b=>Math.max(0,(b.total||0)-bSpent(d,b)));const from=now?T+1:1;
    if(left&&from<=N){const per=left/(N-from+1);for(let day=from;day<=N;day++)ev.push({day,amt:-per,kind:'bud',done:false,name:'Orçamentos'})}}
  return ev;
}
function dailyBalance(d,y,m,start){const N=daysIn(y,m),ev=flowEvents(d,y,m),out=[];let bal=start||0;
  for(let day=1;day<=N;day++){bal+=sum(ev.filter(e=>e.day===day),e=>e.amt);out.push({d:day,bal})}return out}
function balanceParts(d,y,m){const ev=flowEvents(d,y,m),g=(k,done)=>ev.filter(e=>e.kind===k&&e.done===done);
  const tx=d.tx.filter(t=>!String(t.src).startsWith('cof:'));
  return {incDone:g('inc',true),incTodo:g('inc',false),billDone:g('bill',true),billTodo:g('bill',false),
    txBud:sum(tx.filter(t=>String(t.src).startsWith('b:')),t=>t.v),txAvu:sum(tx.filter(t=>!String(t.src).startsWith('b:')),t=>t.v)+sum(d.unplanned,u=>u.value),
    cof:-sum(g('cof',true),e=>e.amt),budLeft:-sum(g('bud',false),e=>e.amt),
    moved:sum(ev.filter(e=>e.done),e=>e.amt)}}
function budgetCard(d,b,y,m){
  const N=daysIn(y,m),T=todayIdx(y,m),spent=bSpent(d,b),total=b.total||0,left=total-spent;

  else if(isPast(y,m))txt=left>=0?`Mês encerrado. Sobrou <b>${brl(left)}</b>, que ficou no saldo.`:(cls='bad',`Mês encerrado. Passou <b>${brl(-left)}</b> do orçamento.`);

    <div class="dd-meta"><span>Gastou <b class="num">${brl(spent)}</b> de ${brl(total)}</span><span>${total?Math.round(spent/total*100):0}% usado${isNow(y,m)?` · o mês já passou ${Math.round(T/N*100)}%`:''}</span></div>

}
function budgetStrip(d,y,m){

function ddChart(d,y,m,start){

  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo estimado da conta em cada dia de ${MES[m-1]}">${g}</svg>`,pts};

    <div class="kpi"><div class="l">Renda no ano</div><div class="v num">${brl(inc)}</div><div class="s num">${brl(incC)} já recebidos</div></div>
    <div class="kpi"><div class="l">Despesas no ano</div><div class="v num">${brl(exp)}</div><div class="s num">${brl(expC)} já pagos</div></div>
    <div class="kpi"><div class="l">Nos cofrinhos</div><div class="v num">${brl(inv)}</div><div class="s">${inv>0?`guardado em ${y}`:'nenhum depósito ainda'}</div></div>
    <div class="kpi dark ${inc-exp>=0?'pos':'neg'}"><div class="l">Saldo projetado</div><div class="v num">${brl(inc-exp)}</div><div class="s">renda menos despesas</div></div>
  </div>
  <section class="card"><div class="card-h"><h2>Renda × despesas por mês</h2></div>
    <div class="chart">${chart(rows)}</div>
    <div class="legend"><span><i style="background:var(--inc)"></i>Renda</span><span><i style="background:var(--exp)"></i>Despesas</span><span><i style="background:var(--surface-2);outline:1px dashed var(--muted)"></i>Barras apagadas = previsto (mês aberto ou não preenchido)</span></div>
  </section>
  <h2 style="margin-top:6px">Insights</h2>
  <div class="insights">${insights(y,rows)}</div>
  <section class="card"><div class="card-h"><h2>Mês a mês</h2></div><div class="tbl-wrap"><table>
    <thead><tr><th>Mês</th><th>Renda</th><th>Despesas</th><th>Saldo</th><th>Contas pagas</th></tr></thead>
    <tbody>${rows.map(r=>{if(!r.c)return `<tr data-action="month" data-m="${r.m}"><td>${MES[r.m-1]}</td><td colspan="4" style="text-align:left;color:var(--muted)">Mês não criado</td></tr>`;const c=r.c;const pct=c.total?c.paidN/c.total:0;
      const st=c.closed?'<span class="pill ok">fechado</span>':isNow(y,r.m)?'<span class="pill warn">atual</span>':isPast(y,r.m)?'<span class="pill warn">sem dados</span>':'<span class="pill">previsto</span>';
      return `<tr data-action="month" data-m="${r.m}"><td>${MES[r.m-1]}${st}</td><td class="num">${brl(c.inc)}</td><td class="num">${brl(c.exp)}</td><td class="num ${c.bal>=0?'pos':'neg'}">${brl(c.bal)}</td><td class="num"><span class="minibar"><b style="width:${pct*100}%"></b></span>${c.paidN}/${c.total}</td></tr>`}).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${brl(inc)}</td><td class="num">${brl(exp)}</td><td class="num ${inc-exp>=0?'pos':'neg'}">${brl(inc-exp)}</td><td class="num">${paidN}/${totN}</td></tr></tfoot>
  </table></div></section>`;
}

function chart(rows){
  const W=720,H=260,L=48,R=10,T=14,B=30;
  const max=Math.max(1,...rows.filter(r=>r.c).flatMap(r=>[r.c.inc,r.c.exp]));
  const step=[100,200,250,500,1000,2000,2500,5000,10000].find(s=>max/s<=5)||Math.ceil(max/5/1000)*1000;
  const top=Math.ceil(max/step)*step; const sy=v=>T+(H-T-B)*(1-v/top);
  const gw=(W-L-R)/12, bw=Math.min(18,gw*0.32);
  let g='';
  for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${short(v)}</text>`}
  rows.forEach((r,i)=>{const cx=L+gw*i+gw/2;
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11.5" font-weight="${isNow(S.year,r.m)?800:500}" fill="${isNow(S.year,r.m)?'var(--fg)':'var(--muted)'}">${MESC[i]}</text>`;
    if(!r.c)return;const op=r.c.closed?1:.38;
    const b=(x,v,col)=>{const h=Math.max(0,sy(0)-sy(v));return `<rect x="${x}" y="${sy(0)-h}" width="${bw}" height="${h}" rx="3" fill="${col}" fill-opacity="${op}"${r.c.closed?'':` stroke="${col}" stroke-dasharray="3 2" stroke-width="1"`}><title>${MES[i]}: ${col.includes('inc')?'renda':'despesas'} ${brl(v)}</title></rect>`};
    g+=b(cx-bw-1,r.c.inc,'var(--inc)')+b(cx+1,r.c.exp,'var(--exp)');
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de renda e despesas por mês">${g}</svg>`;
}

function insights(y,rows){
  const out=[];const have=rows.filter(r=>r.c);
  // reference month: current if this year, else December/last
  const refM=y===NY?NM:(y<NY?12:1); const ref=getM(y,refM)||have[have.length-1]?.d;
  // 1. parcelas
  if(ref){
    const ps=[...ref.fixed,...ref.variable].map(b=>({b,p:parcel(b.name)})).filter(x=>x.p).map(x=>{const left=x.p.t-x.p.n;const [ey,em]=addMonths(y,ref.month,left);return {name:baseName(x.b.name),left,end:`${MESC[em-1]}/${String(ey).slice(2)}`,val:x.b.prev||0,pct:x.p.n/x.p.t}}).sort((a,b)=>a.left-b.left);
    if(ps.length){const tot=sum(ps,x=>x.val);
      out.push(`<div class="ins"><div class="k"><i></i>Parcelas em andamento</div><p>${ps.length} parcelamentos somam <b>${brl(tot)}/mês</b>. Esse valor volta para o seu bolso conforme eles terminam.</p><ul>${ps.slice(0,6).map(x=>`<li><span>${esc(x.name)}</span><span>${x.left===0?'última parcela':`termina ${x.end}`} · ${brl(x.val)}</span></li><li style="display:block;margin-top:-4px"><div class="track"><b style="width:${x.pct*100}%;background:var(--accent)"></b></div></li>`).join('')}</ul></div>`)}
  }
  // 2. maiores gastos do ano
  const agg={};have.forEach(r=>{[...r.d.fixed,...r.d.variable].forEach(b=>{const k=baseName(b.name);const v=r.c.closed?(b.real||0):(b.paid?(b.real??b.prev):b.prev)||0;agg[k]=(agg[k]||0)+v});(r.d.budgets||[]).forEach(b=>{const sp=sum((r.d.tx||[]).filter(t=>t.src==='b:'+b.id),t=>t.v);agg[b.name]=(agg[b.name]||0)+(r.c.closed?sp:Math.max(b.total||0,sp))})});
  const top=Object.entries(agg).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(top.length){const mx=top[0][1];const all=sum(Object.values(agg),v=>v);
    out.push(`<div class="ins"><div class="k"><i></i>Onde vai o seu dinheiro</div><p><b>${esc(top[0][0])}</b> é o maior gasto do ano: ${Math.round(top[0][1]/all*100)}% de todas as contas.</p><ul>${top.map(([k,v])=>`<li><span>${esc(k)}</span><span>${brl(v)}</span></li><li style="display:block;margin-top:-4px"><div class="track"><b style="width:${v/mx*100}%"></b></div></li>`).join('')}</ul></div>`)}
  // 3. meses sem dados
  const unf=have.filter(r=>isPast(y,r.m)&&!r.c.filled&&r.c.total);
  if(unf.length)out.push(`<div class="ins warn"><div class="k"><i></i>Meses sem preenchimento</div><p>${unf.map(r=>`<b>${MES[r.m-1]}</b>`).join(', ')} já ${unf.length>1?'passaram':'passou'} sem nenhuma conta marcada como paga. Até você marcar, o panorama usa os valores previstos.</p></div>`);
  // 4. precisão do planejamento
  const cl=have.filter(r=>r.c.closed&&r.c.expPrev>0);
  if(cl.length){const devs=cl.map(r=>({m:r.m,d:(r.c.exp-r.c.expPrev-r.c.unpl-r.c.avu)/r.c.expPrev}));const avg=sum(devs,x=>Math.abs(x.d))/devs.length;const worst=devs.slice().sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))[0];
    out.push(`<div class="ins ${avg>.1?'warn':''}"><div class="k"><i></i>Precisão do planejamento</div><p>Nos meses fechados, o gasto real ficou em média <b>${(avg*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%</b> distante do previsto. ${Math.abs(worst.d)>.005?`O maior desvio foi em <b>${MES[worst.m-1]}</b> (${worst.d>0?'+':''}${(worst.d*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}%).`:'Seu planejamento está certeiro.'}</p></div>`)}
  // 5. melhor e pior mês
  if(have.length>1){const s=have.slice().sort((a,b)=>b.c.bal-a.c.bal);const best=s[0],worst=s[s.length-1];const neg=have.filter(r=>r.c.bal<0);
    out.push(`<div class="ins ${neg.length?'bad':''}"><div class="k"><i></i>Saldo mês a mês</div><p>Melhor mês: <b>${MES[best.m-1]}</b> (${brl(best.c.bal)}). Mais apertado: <b>${MES[worst.m-1]}</b> (${brl(worst.c.bal)}). ${neg.length?`${neg.length} ${neg.length>1?'meses fecham':'mês fecha'} no vermelho: ${neg.map(r=>MESC[r.m-1]).join(', ')}.`:'Nenhum mês no vermelho.'}</p></div>`)}
  // 6. cartões
  const card=have.map(r=>({m:r.m,v:sum([...r.d.fixed,...r.d.variable].filter(b=>/cr[ée]dito|fatura|cart[aã]o/i.test(b.name)),b=>r.c.closed?b.real:(b.real??b.prev))})).filter(x=>x.v>0);
  if(card.length){const avg=sum(card,x=>x.v)/card.length;const avgExp=sum(have,r=>r.c.exp)/have.length;
    out.push(`<div class="ins"><div class="k"><i style="background:var(--warn)"></i>Cartões de crédito</div><p>Faturas e créditos somam em média <b>${brl(avg)}/mês</b>, cerca de ${Math.round(avg/avgExp*100)}% das despesas mensais.</p></div>`)}
  // 7. investimento
  const inv=sum(have,r=>r.c.invReal);const incAll=sum(have,r=>r.c.inc);
  out.push(`<div class="ins ${inv>0?'':'warn'}"><div class="k"><i></i>Quanto você guarda</div><p>${inv>0?`Você guardou <b>${brl(inv)}</b> nos cofrinhos em ${y}${incAll>0?`, ${(inv/incAll*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% da renda`:''}.`:`Nenhum depósito nos cofrinhos em ${y}. Guardar 10% da renda média daria <b>${brl(incAll/Math.max(1,have.length)*.1)}/mês</b>.`}</p></div>`);
  const cofs=Object.values(S.cofs).filter(k=>k.status!=='done'||String(k.doneYM||'').startsWith(String(y))).sort((a,b)=>(a.order??9e15)-(b.order??9e15));
  const yr=String(y), inY=o=>Object.entries(o||{}).filter(([kk])=>kk.startsWith(yr));
  const cDep=k=>sum(inY(k.deposits),e=>e[1])+sum(inY(k.adjust).filter(e=>e[1]>0),e=>e[1]);
  const cWd=k=>-sum(inY(k.adjust).filter(e=>e[1]<0),e=>e[1]);
  const D=sum(cofs,cDep), W=sum(cofs,cWd);
  const outs=cofs.flatMap(k=>inY(k.adjust).filter(e=>e[1]<0).map(([kk,v])=>({kk,v:-v,k}))).sort((a,b)=>b.kk.localeCompare(a.kk));
  if(cofs.length)out.push(`<div class="ins${W>0?' warn':''}"><div class="k"><i></i>Seus cofrinhos</div>
    <p>Em ${y} você colocou <b>${brl(D)}</b>${W>0?` e tirou <b class="wd">${brl(W)}</b>, ou seja, ${Math.round(W/Math.max(D,0.01)*100)}% do que guardou voltou para o dia a dia`:' e não precisou tirar nada'}. Saldo total: <b>${brl(sum(Object.values(S.cofs),cofTotal))}</b>.</p>
    ${D>0?`<div class="splitbar" aria-hidden="true"><b style="width:${Math.max(0,100-W/D*100)}%"></b><i style="width:${Math.min(100,W/D*100)}%"></i></div><div class="splitleg"><span>ficou guardado</span><span>foi retirado</span></div>`:''}
    <ul>${cofs.map(k=>{const t=cofTotal(k),w=cWd(k),d=cDep(k);return `<li><span><span class="cdot" style="background:${cofColor(k)}"></span>${esc(k.name)}${k.status==='done'?' ✓':''}</span><span>${brl(t)}${k.goal?` de ${brl(k.goal)}`:''}</span></li>${(d||w)?`<li class="cofline"><span>+${brl(d)} colocado${w?` · <em>−${brl(w)} retirado</em>`:''}</span></li>`:''}${k.goal?`<li style="display:block;margin-top:-4px"><div class="track"><b style="width:${Math.min(100,Math.max(0,t/k.goal*100))}%;background:${cofColor(k)}"></b></div></li>`:''}`}).join('')}</ul>
    ${outs.length?`<div class="wdlist"><div class="k" style="margin-top:12px">Últimas retiradas</div>${outs.slice(0,5).map(o=>`<div><span>${MESC[+o.kk.slice(5)-1]} · ${esc(o.k.name)}${(()=>{const ds=((S.months[o.kk]||{}).tx||[]).filter(t=>t.src==='cof:'+o.k.id&&t.desc).map(t=>t.desc);return ds.length?': '+esc(ds.join(', ')):''})()}</span><em>−${brl(o.v)}</em></div>`).join('')}</div>`:''}</div>`);
  return out.join('');
}

function renderModal(){
  const M=S.modal;if(!M){modal.innerHTML='';return}
  if(modal.dataset.sig===M.sig&&modal.innerHTML)return;
  modal.dataset.sig=M.sig;
  if(M.type==='year'){
    const ys=years();const ny=ys.length?ys[ys.length-1]+1:NY;const base=getM(ny-1,12);

      <h2>Criar o ano ${ny}</h2><p class="sub" style="margin:0">Os 12 meses são criados de uma vez. Você pode editar tudo depois.</p>
      ${base?`<label class="opt"><input type="radio" name="base" value="copy" checked><span>Copiar contas de Dezembro/${ny-1}<small>Contas fixas e variáveis vão para todos os meses; parcelas avançam e somem quando terminam.</small></span></label>`:''}
      <label class="opt"><input type="radio" name="base" value="blank"${base?'':' checked'}><span>Começar do zero<small>Meses vazios, só com as linhas de renda e aplicações.</small></span></label>

    modal.innerHTML=`<div class="scrim" data-action="close"><form class="sheet" id="cofform" role="dialog" aria-label="Cofrinho">

      <label>Meta (R$)<input class="field" id="c_goal" inputmode="decimal" value="${dec(k.goal??null)}" placeholder="Opcional"></label>
      ${M.id?`<div class="cofmov"><div class="sub" style="margin:0">Saldo em ${MES[S.month-1]}: <b class="num">${brl(cofUpTo(k,mid(S.year,S.month)))}</b>${k.status==='done'?' · concluído':''}</div><div class="r2"><label>Retirar (R$)<input class="field" id="c_out" inputmode="decimal" placeholder="Ex.: 340,00"></label><label>Ou corrigir saldo para<input class="field" id="c_bal" inputmode="decimal" value="${dec(cofUpTo(k,mid(S.year,S.month)))}"></label></div><div class="sub" style="margin:0;font-size:12.5px">A mudança fica registrada em ${MES[S.month-1]} e vale daqui para frente.</div></div>`:'<p class="sub" style="margin:0">Ele aparece a partir deste mês e segue nos próximos até você concluir.</p>'}
      ${M.id?(k.status==='done'?`<button type="button" class="btn ghost" data-action="cofreopen">Reabrir cofrinho</button>`:`<button type="button" class="btn ghost" data-action="cofdone">✓ Concluir cofrinho</button><p class="sub" style="margin:-6px 0 0;font-size:12.5px">Concluído, ele fica visível neste mês e some dos próximos.</p>`):''}
      <div class="acts">${M.id?`<button type="button" class="btn danger${M.armed?' armed':''}" data-action="cofdel">${M.armed?'Toque de novo para excluir':'Excluir'}</button>`:''}

      <label>Valor real (R$)<input class="field" id="f_real" inputmode="decimal" value="${dec(x.real)}"></label></div>
    ${simple?'':subBlock(x)}
    ${M.g==='income'?`<label>Dia em que o dinheiro cai<input class="field" id="f_due" type="number" min="1" max="31" value="${x.due??''}" placeholder="opcional · usado no saldo do Dia a dia"></label>`:''}
    ${simple?'':`<div class="r2"><label>Dia do vencimento<input class="field" id="f_due" type="number" min="1" max="31" value="${x.due??''}" placeholder="opcional"></label>

    ${M.type==='add'?`<label class="chk"><input type="checkbox" id="f_rep"${simple?'':' checked'}>Repetir nos próximos meses</label>`:`<label class="chk"><input type="checkbox" id="f_rep">Aplicar nome, previsto e vencimento nos próximos meses</label>`}
    ${M.type==='edit'&&M.armed?(()=>{const n=new Set(futureMatches(x.name).map(f=>f.key)).size;return `<div class="delbox"><b>Excluir “${esc(x.name)}”?</b>${n?`<span>Essa conta também aparece em mais ${n} ${n>1?'meses':'mês'} depois de ${MES[S.month-1]}.</span>`:`<span>Ela não existe nos meses seguintes, então só há o que excluir em ${MES[S.month-1]}.</span>`}
      <div class="delacts"><button type="button" class="btn danger armed" data-action="delone">Só em ${MES[S.month-1]}</button>${n?`<button type="button" class="btn danger armed" data-action="delall">${MES[S.month-1]} e os próximos</button>`:''}<button type="button" class="btn ghost" data-action="delback">Voltar</button></div></div>`})():''}
    <div class="acts"${M.armed?' hidden':''}>${M.type==='edit'?`<button type="button" class="btn danger" data-action="del">Excluir</button>`:''}
      <div><button type="button" class="btn ghost" data-action="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></div>
  </form></div>`;
  setTimeout(()=>{const f=document.getElementById('f_name');if(f&&M.type==='add')f.focus()},30);
}
function openModal(m){m.sig=Math.random().toString(36);S.modal=m;renderModal()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const a=t.dataset.action;
  if(a==='close'){if(e.target===t||t.tagName==='BUTTON')closeModal();return}
  if(a!=='finalize'&&S.finArm){S.finArm=false;if(a!=='month')render()}
  if(a==='month'){if(S.view==='year')S.view='month';S.month=+t.dataset.m;S._scrolled=false;render();window.scrollTo({top:0});return}
  if(a==='yearview'){S.view='year';render();window.scrollTo({top:0});return}
  if(a==='orgtoggle'){if(S.org){S.org=false;const n=S.orgFuture&&S.orgMoved?applyOrderForward():0;S.orgMoved=false;render();toast(n?`Ordem salva neste mês e em mais ${n} ${n>1?'meses':'mês'}`:'Ordem salva')}else{S.org=true;S.orgMoved=false;render()}return}
  if(a==='mv'){const g=t.dataset.g,id=t.dataset.id,dir=+t.dataset.dir;mutate(d=>{const arr=d[g];const i=arr.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]});S.orgMoved=true;return}
  if(a==='filter'){S.filter=t.dataset.f;render();return}
  if(a==='finalize'){const y=S.year,m=S.month;const d=getM(y,m);const c=d?calc(d,y,m):null;

      if(diff){k.adjust={...(k.adjust||{})};const v=Math.round(((k.adjust[ym]||0)+diff)*100)/100;if(v)k.adjust[ym]=v;else delete k.adjust[ym];moved=diff<0?`Retirado ${brl(-diff)} de “${name}”`:`Saldo de “${name}” ajustado`}}
    else{const id='c'+uid();k={id,name,goal,status:'active',createdYM:mid(S.year,S.month),doneYM:null,deposits:{},order:Date.now(),color};S.cofs[id]=k}

  if(f.id==='yearform'){const ny=+document.getElementById('ny').value;const base=f.querySelector('input[name=base]:checked').value;

      for(const g of ['fixed','variable']){a.push([GROUPS[g],'Gasto previsto','Valor real','Pago','Vencimento']);d[g].forEach(x=>a.push([x.name,v(x.prev),v(x.real),x.paid?'Sim':'Não',x.due?'Dia '+x.due:'']));a.push(['Gasto total',sum(d[g],x=>x.prev),sum(d[g],x=>x.real)],[])}
      if((d.budgets||[]).length){a.push(['Orçamentos','Previsto','Gasto']);d.budgets.forEach(b=>a.push([b.name,v(b.total),sum((d.tx||[]).filter(t=>t.src==='b:'+b.id),t=>t.v)]));a.push([])}

      a.push(['Gastos não planejados','Data','Valor']);d.unplanned.forEach(u=>a.push([u.desc,u.date?u.date.split('-').reverse().join('/'):'',v(u.value)]));a.push(['Total não planejado','',c.unpl],[]);

const L={mode:null,step:0,buf:'',first:'',err:'',hash:null,salt:null,busy:false,forgot:false};
const lockEl=document.getElementById('lock');
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function sessOk(){try{return sessionStorage.getItem('liberta.unlocked')==='1'}catch(e){return false}}
function showLock(mode){L.mode=mode;L.step=0;L.buf='';L.first='';L.err='';L.forgot=false;app.hidden=mode!=='change';renderLock()}
function closeLock(){L.mode=null;try{sessionStorage.setItem('liberta.unlocked','1')}catch(e){}app.hidden=false;renderLock();render()}
const LT={create:[['Crie sua senha','4 números para abrir o Liberta em qualquer aparelho.'],['Confirme a senha','Digite os mesmos 4 números de novo.']],
  unlock:[['Digite sua senha','Para abrir suas finanças.']],
  change:[['Senha atual','Digite a senha que você usa hoje.'],['Nova senha','Escolha 4 números novos.'],['Confirme a nova senha','Digite os novos números de novo.']]};
function renderLock(shake){
  if(!L.mode){lockEl.hidden=true;lockEl.innerHTML='';return}
  lockEl.hidden=false;
  if(L.mode==='checking'){lockEl.innerHTML='<div class="lock-in"><div class="brand"><i>L</i>Liberta</div><p style="margin:0">Abrindo…</p></div>';return}
  const [t,sub]=LT[L.mode][L.step];
  const keys=['1','2','3','4','5','6','7','8','9',L.mode==='change'?'cancel':'sp','0','del'];
  lockEl.innerHTML=`<div class="lock-in" role="dialog" aria-label="${t}"><div class="brand"><i>L</i>Liberta</div><h2>${t}</h2><p>${sub}</p>
    ${L.forgot?`<div class="lnote">Sua senha fica salva só para este app. Para redefinir, volte à conversa com o Claude onde o Liberta foi criado e peça: <b>“apague a senha do Liberta”</b>. Suas contas e cofrinhos não são apagados.</div><button class="linkbtn" data-l="back">Voltar</button>`:`
    <div class="dots${shake?' shake':''}" aria-label="${L.buf.length} de 4 dígitos">${[0,1,2,3].map(i=>`<i class="${i<L.buf.length?'on':''}"></i>`).join('')}</div>
    <div class="lerr" role="alert">${esc(L.err)}</div>
    <div class="pad">${keys.map(k=>k==='sp'?'<button class="sp" tabindex="-1" aria-hidden="true"></button>':k==='del'?'<button class="ghost" data-pin="del" aria-label="Apagar">⌫</button>':k==='cancel'?'<button class="ghost" data-pin="cancel">Cancelar</button>':`<button data-pin="${k}">${k}</button>`).join('')}</div>
    ${L.mode==='unlock'?'<button class="linkbtn" data-l="forgot">Esqueci a senha</button>':''}`}</div>`;
}
lockEl.addEventListener('click',e=>{const b=e.target.closest('[data-pin],[data-l]');if(!b)return;
  if(b.dataset.l==='forgot'){L.forgot=true;renderLock();return}
  if(b.dataset.l==='back'){L.forgot=false;renderLock();return}
  pinPress(b.dataset.pin)});
async function pinPress(k){
  if(L.busy||!L.mode||L.mode==='checking')return;
  if(k==='cancel'){L.mode=null;app.hidden=false;renderLock();return}
  if(k==='del'){L.buf=L.buf.slice(0,-1);renderLock();return}
  if(L.buf.length>=4)return;
  L.buf+=k;L.err='';renderLock();
  if(L.buf.length<4)return;
  L.busy=true;const pin=L.buf;
  try{
    const fail=msg=>{L.err=msg;L.buf='';renderLock(true)};
    if(L.mode==='unlock'||(L.mode==='change'&&L.step===0)){
      const ok=(await sha(L.salt+pin))===L.hash;
      if(!ok){fail('Senha incorreta');return}
      if(L.mode==='unlock'){closeLock();return}
      L.step=1;L.buf='';renderLock();return}
    const firstStep=L.mode==='create'?0:1;
    if(L.step===firstStep){L.first=pin;L.step++;L.buf='';renderLock();return}
    if(pin!==L.first){L.step=firstStep;L.first='';fail('As senhas não conferem. Comece de novo.');return}
    const salt=uid()+uid(), hash=await sha(salt+pin);
    await db.doc('config/lock').set({hash,salt,updatedAt:new Date().toISOString()});
    L.hash=hash;L.salt=salt;const was=L.mode;closeLock();toast(was==='create'?'Senha criada':'Senha alterada');
  }catch(e){L.err='Não consegui salvar a senha. Confira a conexão.';L.buf='';renderLock(true)}
  finally{L.busy=false}
}
async function initLock(){
  showLock('checking');
  let snap=null;
  for(let i=0;i<2&&!snap;i++){try{snap=await db.doc('config/lock').get()}catch(e){await new Promise(r=>setTimeout(r,800))}}
  if(!snap){L.mode=null;app.hidden=false;renderLock();render();toast('Não consegui verificar a senha agora.');return}
  if(snap.exists){const d=snap.data();L.hash=d.hash;L.salt=d.salt;if(sessOk()){L.mode=null;app.hidden=false;renderLock();render()}else showLock('unlock')}
  else showLock('create');
}

/* ---------- backup ---------- */
function renderBackup(M){
  const nM=Object.keys(S.months).length,nC=Object.keys(S.cofs).length,P=M.pending;
  let rest;
  if(P){
    const ys=[...new Set(Object.keys(P.months).map(k=>k.slice(0,4)))].sort().join(', ');
    const over=Object.keys(P.months).filter(k=>S.months[k]).length+Object.keys(P.cofrinhos).filter(k=>S.cofs[k]).length;
    rest=`<div class="opt" style="cursor:default;flex-direction:column;gap:6px"><b>Backup de ${P.when}</b>
      <span>${Object.keys(P.months).length} ${Object.keys(P.months).length===1?'mês':'meses'} (${ys||'nenhum ano'}) e ${Object.keys(P.cofrinhos).length} ${Object.keys(P.cofrinhos).length===1?'cofrinho':'cofrinhos'}${P.lock?' · inclui o PIN':''}.</span>
      <small style="color:var(--muted)">${over?`${over} ${over>1?'itens que já existem aqui serão substituídos':'item que já existe aqui será substituído'} pela versão do backup. `:''}Nada que exista só aqui é apagado.</small></div>
      <div class="acts"><div><button type="button" class="btn ghost" data-action="bkpick">Escolher outro</button><button type="button" class="btn${M.armed?' danger armed':''}" data-action="bkrestore"${M.busy?' disabled':''}>${M.busy?'Restaurando…':M.armed?'Toque de novo para confirmar':'Restaurar'}</button></div></div>`;
  }else rest=`<button type="button" class="btn ghost" data-action="bkpick">Escolher arquivo de backup…</button>`;
  modal.innerHTML=`<div class="scrim" data-action="close"><div class="sheet" role="dialog" aria-label="Backup">
    <h2>Backup dos seus dados</h2>
    <p class="sub" style="margin:0">Um arquivo com tudo: ${nM} meses, ${nC} cofrinhos e o PIN. Guarde no seu Drive ou celular pessoal. Ele serve para levar o app para outra conta ou outro lugar.</p>
    <button type="button" class="btn" data-action="bkdown">⤓ Baixar backup</button>
    <div style="border-top:1px solid var(--line);margin:4px 0"></div>
    <div style="font-size:12.5px;font-weight:700;color:var(--muted)">Restaurar de um backup</div>
    ${rest}
    <input type="file" id="bk_file" accept=".json,application/json" hidden>
    <div class="acts">${window.libertaSair?`<button type="button" class="btn ghost" onclick="libertaSair()">Sair da conta Google</button>`:''}<div><button type="button" class="btn ghost" data-action="close">Fechar</button></div></div>
  </div></div>`;
}
function stripId(o){const c=clone(o);delete c.id;return c}
let bkBusy=false;
async function downloadBackup(){
  if(bkBusy)return;bkBusy=true;
  try{
    const dl=await window.claude.use('downloads');
    if(!dl){toast('Download indisponível neste aparelho.');return}
    let lock=null;try{const sn=await db.doc('config/lock').get();if(sn.exists)lock=clone(sn.data())}catch(e){}
    const months={};Object.keys(S.months).sort().forEach(k=>months[k]=clone(S.months[k]));
    const cofrinhos={};Object.keys(S.cofs).forEach(k=>cofrinhos[k]=stripId(S.cofs[k]));
    const out={app:'liberta',format:1,exportedAt:new Date().toISOString(),months,cofrinhos,lock};
    const txt=JSON.stringify(out,null,1);
    const stamp=new Date().toISOString().slice(0,10);
    await dl.save({filename:`LIBERTA_backup_${stamp}.json`,data:new TextEncoder().encode(txt)});
    toast('Backup salvo');
  }catch(e){const c=e&&e.code;
    if(c==='declined')toast('Download cancelado');
    else if(c==='rate_limited')toast('Já existe um download aguardando confirmação.');
    else toast('Não consegui gerar o backup. Tente de novo.');
  }finally{bkBusy=false}
}
function readBackupFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){toast('Esse arquivo não é um backup do Liberta.');return}
    if(!d||d.app!=='liberta'||typeof d.months!=='object'){toast('Esse arquivo não é um backup do Liberta.');return}
    const when=d.exportedAt?new Date(d.exportedAt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'data desconhecida';
    openModal({type:'backup',pending:{months:d.months||{},cofrinhos:d.cofrinhos||{},lock:d.lock||null,when}});
  };
  r.onerror=()=>toast('Não consegui ler o arquivo.');
  r.readAsText(file);
}
async function restoreBackup(){
  const M=S.modal;if(!M||!M.pending||M.busy)return;
  if(!M.armed){M.armed=true;M.sig=Math.random().toString(36);renderModal();return}
  M.busy=true;M.sig=Math.random().toString(36);renderModal();
  const P=M.pending;let ok=0,fail=0;
  const put=async(path,body)=>{for(let i=0;i<3;i++){try{await db.doc(path).set(body);ok++;return}catch(e){await new Promise(r=>setTimeout(r,700))}}fail++};
  for(const k of Object.keys(P.months).sort())await put('months/'+k,P.months[k]);
  for(const k of Object.keys(P.cofrinhos))await put('cofrinhos/'+k,P.cofrinhos[k]);
  if(P.lock&&P.lock.hash&&P.lock.salt)await put('config/lock',P.lock);
  closeModal();
  toast(fail?`Restaurado com ${fail} falha(s). Tente de novo.`:`Backup restaurado (${ok} itens)`);
}

/* ---------- boot ---------- */
(async()=>{
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.nodb=true;render();return}
  initLock();
  db.collection('months').onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=clone(d.data())});
    // keep local copies of docs with writes still in flight
    S.months=Object.assign(next,S.saving?Object.fromEntries(Object.entries(S.months).filter(([k])=>!next[k])):{});
    if(!S.loaded){S.loaded=true;const ys=years();if(ys.length&&!ys.includes(NY)){S.year=ys[ys.length-1];S.month=1}else if(ys.includes(NY)){S.month=firstOpen(NY)}}
    migrateBudgets();
    softRender();
  },err=>{S.offline=true;setSync();toast('Conexão com os dados perdida. Recarregue a página.')});
  db.collection('cofrinhos').onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{if(d.exists)n[d.id]={...clone(d.data()),id:d.id}});S.cofs=n;if(S.loaded)softRender()},()=>{});
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},12000);
})();
</script>
